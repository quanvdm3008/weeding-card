# SPA + API gateway cho Wedding Invitation Studio (container frontend)
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https://www.youtube.com https://maps.google.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API requests to the backend service defined by Docker Compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Preserve the JSESSIONID cookie for the same-origin SPA.
        proxy_cookie_path / /;
        client_max_body_size 25m;
    }

    # STOMP WebSocket: pass Upgrade/Connection headers and keep idle connections open.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Route /share/ directly to the backend OpenGraph HTML endpoint.
    location /share/ {
        proxy_pass http://backend:8080/share/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Single public probe for the platform/load balancer; actuator metrics stay private.
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        access_log off;
    }

    # Social Bot Detection cho /invitation/:slug (Zalo, Facebook, Telegram...)
    location ~ ^/invitation/([^/]+)$ {
        if ($http_user_agent ~* "(ZaloBot|facebookexternalhit|Twitterbot|LinkedInBot|TelegramBot|WhatsApp|bingbot|googlebot)") {
            proxy_pass http://backend:8080/share/$1;
        }
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback: send every other route to index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
